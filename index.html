<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live GPS Tracker</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }
    header {
      padding: 16px;
      background: #123c69;
      color: white;
      text-align: center;
    }
    #info {
      padding: 12px;
      background: white;
      line-height: 1.7;
    }
    #map {
      height: 65vh;
      min-height: 350px;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h2>Live GPS Tracker</h2>
  <div>ESP8266 + NEO-6M</div>
</header>

<div id="info">
  Status: <span id="status">Connecting...</span><br>
  Latitude: <span id="lat">--</span><br>
  Longitude: <span id="lon">--</span><br>
  Last update: <span id="updated">--</span>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const CHANNEL_ID = "3558156";

  const map = L.map("map").setView([20, 0], 2);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  let marker = null;

  async function updateGPS() {
    try {
      document.getElementById("status").textContent =
        "Fetching GPS data...";

      const url =
        `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("ThingSpeak HTTP " + response.status);
      }

      const data = await response.json();
      const lat = Number(data.field1);
      const lon = Number(data.field2);

      if (data.field1 == null || data.field2 == null ||
          !Number.isFinite(lat) || !Number.isFinite(lon) ||
          Math.abs(lat) > 90 || Math.abs(lon) > 180 ||
          (lat === 0 && lon === 0)) {
        throw new Error("GPS coordinates unavailable");
      }

      const position = [lat, lon];

      document.getElementById("lat").textContent = lat;
      document.getElementById("lon").textContent = lon;
      document.getElementById("updated").textContent =
        data.created_at || new Date().toLocaleString();

      if (!marker) {
        marker = L.marker(position).addTo(map)
          .bindPopup("Latest GPS location");
      } else {
        marker.setLatLng(position);
      }

      map.setView(position, 16);
      marker.openPopup();

      document.getElementById("status").textContent =
        "GPS data received";

    } catch (error) {
      document.getElementById("status").textContent =
        error.message;
    }
  }

  updateGPS();
  setInterval(updateGPS, 20000);
</script>

</body>
</html>
